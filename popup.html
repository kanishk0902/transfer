<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Claude Chat Transfer</h1>
    <button id="options" class="icon" title="Options">⚙</button>
  </header>

  <div class="actions">
    <button id="saveBrief" class="primary">Save with handoff brief</button>
    <button id="save" class="secondary">Save transcript only</button>
  </div>

  <div id="usage" class="usage"></div>

  <div id="status" aria-live="polite"></div>

  <div class="toolbar">
    <input id="search" type="search" placeholder="Search saved chats…" autocomplete="off">
    <select id="sort" title="Sort">
      <option value="savedAt">Newest</option>
      <option value="title">Title</option>
    </select>
  </div>

  <div class="toolbar">
    <button id="sync" class="secondary small">Sync from Drive</button>
    <label class="check"><input type="checkbox" id="debug"> Debug</label>
    <button id="copyDebug" class="secondary small" hidden>Copy report</button>
  </div>

  <div id="list"></div>

  <script type="module" src="popup.js"></script>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 340px; margin: 0; padding: 14px; font: 13px/1.4 system-ui, sans-serif; color: #222; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: #777; margin: 16px 0 6px; }
    button { font: inherit; padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; }
    button:hover { background: #f4f4f4; }
    button.primary { background: #c15f3c; color: #fff; border-color: #c15f3c; width: 100%; padding: 8px; }
    button.primary:hover { background: #a94f31; }
    .chat { border: 1px solid #e4e4e4; border-radius: 8px; padding: 8px; margin-bottom: 8px; }
    .chat .t { font-weight: 600; word-break: break-word; }
    .chat .m { color: #888; font-size: 11px; margin: 2px 0 6px; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; }
    #status { margin-top: 8px; min-height: 16px; font-size: 12px; }
    .err { color: #b00020; } .ok { color: #1b7f3b; } .empty { color: #888; }
  </style>
</head>
<body>
  <h1>Claude Chat Transfer</h1>
  <button id="save" class="primary">Save this chat</button>
  <div id="status"></div>
  <h2>Saved chats</h2>
  <div id="list"></div>
  <script src="popup.js"></script>
</body>
</html>
